<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First AI-Built Website</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #4F46E5; }
        p { font-size: 1.1rem; line-height: 1.6; }
        .badge {
            display: inline-block;
            background: #E0E7FF;
            color: #4338CA;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">Live on Vercel</span>
        <h1>Hello, World! 👋</h1>
        <p>I am building this website using GitHub, Vercel, and Gemini.</p>
        <p>Every time I update this file, my website updates automatically.</p>
    </div>

</body>
</html>
